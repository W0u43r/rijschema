<style>
:root{
  --bg:#0f1419; --panel:#171d24; --panel2:#1f2730; --line:#2b3540; --text:#e6edf3; --muted:#8b98a5;
  --accent:#4cc38a; --accent-d:#1f4d38; --blue:#60a5fa; --purple:#c084fc; --warn:#f0b429; --warn-d:#4a3a10;
  --bad:#ef5350; --bad-d:#4a1c1c; --r:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;touch-action:manipulation}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:20;background:rgba(15,20,25,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.top{display:flex;align-items:center;gap:10px;padding:10px calc(14px + var(--sar)) 10px calc(14px + var(--sal));max-width:980px;margin:0 auto}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.me select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:16px;max-width:44vw;min-height:38px}
.sync{font-size:12px;color:var(--muted);max-width:90px;text-align:right;line-height:1.2}
.sync.err{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(23,29,36,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px var(--sar) calc(4px + var(--sab)) var(--sal)}
nav:empty{display:none}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:50px}
nav button .i{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
nav button.on{color:var(--accent)}
nav button.on .i{filter:none;opacity:1}
main{max-width:980px;margin:0 auto;padding:14px calc(14px + var(--sar)) calc(96px + var(--sab)) calc(14px + var(--sal))}
@media (min-width:700px){ nav{justify-content:center} nav button{flex:0 1 120px} }
h2{font-size:17px;margin:20px 0 10px}
h2:first-child{margin-top:4px}
.muted{color:var(--muted)} .small{font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.card.past{opacity:.55}
.card.mine{border-color:#2e6b4f}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:15px;cursor:pointer;white-space:nowrap;min-height:44px}
.btn:active{opacity:.75}
.btn.primary{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px;min-height:36px;border-radius:9px}
.btn.icon{background:none;border:0;color:var(--muted);font-size:18px;min-width:44px;min-height:44px;padding:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .sep{flex:1}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:14px}
.checks label{display:flex;align-items:center;gap:8px;min-height:36px}
.tdate{font-weight:600}
.tloc{color:var(--muted);font-size:14px}
.dir{display:grid;grid-template-columns:56px 1fr 44px;gap:6px;align-items:start;padding:8px 0 4px;border-top:1px solid var(--line)}
.dir:first-of-type{margin-top:8px}

  .toolbar.main{display:grid;grid-template-columns:1fr 1fr}

<body>
<header>
  <div class="top">
    <h1>🏑 Rijschema</h1>
    <div class="me" id="meBox"></div>
    <div class="sync" id="sync"></div>
  </div>
</header>
<main id="main"></main>
<nav id="nav"></nav>

<script>
'use strict';
/* ================= Configuratie =================
 * Optioneel: plak hier de /exec-URL van je Apps Script. Dan hoeven ouders alleen
 * nog de teamcode in te vullen. Zet de teamcode zelf NIET in dit bestand (GitHub is openbaar);
 * deel hem via de uitnodigingslink in Instellingen.
 */
const DEFAULT_API_URL = '';

// Eén kind per ouder: een "kind" is tegelijk het gezin/de chauffeur.
const TABLES = {
  kinderen:        ['id','naam','telefoon','plekken','adres','heen','terug'],
  locaties:        ['id','naam','adres','gewicht','reistijd'],
  trainingen:      ['id','datum','start','eind','locatieId','opmerking'],
  beschikbaarheid: ['id','trainingId','kindId','status'],
  afwezig:         ['id','trainingId','kindId'],
  ritten:          ['id','trainingId','richting','kindId','vast'],
  // Uitzondering: kind mag op (dag) bij (richting) alleen mee met de ouders in 'ouders'
  regels:          ['id','kindId','dag','richting','ouders','opmerking'],
};
const DAYS = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const VERTREK_MARGE = 10; // minuten extra bovenop de rijtijd
const DIRS = ['heen','terug'];
const DIR_LABEL = {heen:'Heen', terug:'Terug'};
const STATUS = [
  {v:'niet',  label:'Kan niet', short:'✗'},
  {v:'heen',  label:'Brengen',  short:'B'},
  {v:'terug', label:'Halen',    short:'H'},
  {v:'beide', label:'Beide',    short:'✓'},
];
const STATUS_LABEL = Object.fromEntries(STATUS.map(s=>[s.v,s.label]));
const LS_CFG='rijschema.cfg', LS_DB='rijschema.localdb2', LS_ME='rijschema.me2', LS_TAB='rijschema.tab';
const TABS = [['schema','🚗','Schema'],['beschikbaar','✋','Ik kan'],['kinderen','👧','Kinderen'],['trainingen','🏟️','Trainingen'],['instellingen','⚙️','Instellingen']];

/* ================= Hulpfuncties ================= */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadJSON(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function saveJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsSet(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch(e){} }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const emptyDb = () => Object.fromEntries(Object.keys(TABLES).map(k=>[k,[]]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => ymd(new Date());
const num = (v,def) => { const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:def; };
function fmtDate(d, opts={weekday:'short', day:'numeric', month:'short'}){ if(!d) return '?'; const x=new Date(d+'T12:00:00'); return isNaN(x)?d:x.toLocaleDateString('nl-NL',opts); }
const fmtTimes = t => esc(t.start) + (t.eind ? '–'+esc(t.eind) : '');
const andList = a => a.length<2 ? a.join('') : a.slice(0,-1).join(', ') + ' en ' + a[a.length-1];
function hash01(s){ let x=2166136261; for(let i=0;i<s.length;i++){ x^=s.charCodeAt(i); x=Math.imul(x,16777619); } return (x>>>0)/4294967296; }
function normalize(d){
  const out=emptyDb();
  for(const k of Object.keys(TABLES)){
    out[k]=(d && Array.isArray(d[k]) ? d[k] : []).map(r=>{ const o={}; TABLES[k].forEach(c=>o[c]= r[c]==null ? '' : String(r[c])); return o; }).filter(r=>r.id);
  }
  return out;
}
function applyOps(d, ops){
  for(const op of ops){
    const cols=TABLES[op.table]; if(!cols) continue;
    if(op.type==='upsert'){
      for(const r of op.rows){
        const id=String(r.id||''); if(!id) continue;
        let ex=d[op.table].find(x=>x.id===id);
        if(!ex){ ex={}; cols.forEach(c=>ex[c]=''); d[op.table].push(ex); }
        cols.forEach(c=>{ if(r[c]!==undefined) ex[c]= r[c]==null ? '' : String(r[c]); });
      }
    } else if(op.type==='delete'){
      const s=new Set(op.ids.map(String));
      d[op.table]=d[op.table].filter(x=>!s.has(x.id));
    }
  }
}
const up  = (table, ...rows) => ({type:'upsert', table, rows});
const del = (table, ids) => ({type:'delete', table, ids});

/* ================= Toestand ================= */
let cfg = Object.assign({api:DEFAULT_API_URL, code:'', mode:''}, loadJSON(LS_CFG,{}));
if(DEFAULT_API_URL && !cfg.api) cfg.api = DEFAULT_API_URL;
let db = emptyDb();
let me = lsGet(LS_ME) || '';
let tab = lsGet(LS_TAB) || 'schema';
let view = {mine:false, past:false};
let queue = [], busy = false, loaded = false, syncMsg = '', syncErr = false, lastError = '';
let IX = null;

// Uitnodigingslink: index.html#api=...&code=...
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(!h.get('api')) return false;
  cfg.api = h.get('api'); cfg.code = h.get('code') || ''; cfg.mode = 'remote';
  saveJSON(LS_CFG, cfg);
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}
readHash();
window.addEventListener('hashchange', ()=>{ if(readHash()){ loaded=false; lastError=''; db=emptyDb(); refresh(); } });

/* ================= Opslag ================= */
async function remoteLoad(){
  const url = cfg.api + (cfg.api.includes('?')?'&':'?') + 'code=' + encodeURIComponent(cfg.code) + '&t=' + Date.now();
  const r = await fetch(url, {redirect:'follow'});
  const j = await r.json();
  if(!j.ok){ const e=new Error(j.error||'Fout'); e.server=true; throw e; }
  return j.data;
}
async function remoteOps(ops){
  // Content-Type text/plain voorkomt een CORS-preflight bij Apps Script
  const r = await fetch(cfg.api, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({code:cfg.code, ops})});
  const j = await r.json();
  if(!j.ok){ const e=new Error(j.error||'Fout'); e.server=true; throw e; }
  return j.data;
}
function setSync(msg, err=false){ syncMsg=msg; syncErr=err; const s=$('#sync'); if(s){ s.textContent=msg; s.className='sync'+(err?' err':''); } }

async function refresh(){
  if(cfg.mode==='local'){ db = normalize(loadJSON(LS_DB, emptyDb())); loaded=true; render(); return; }
  if(cfg.mode!=='remote') { render(); return; }
  if(busy || queue.length) return;
  setSync(loaded ? '↻' : 'Laden…');
  try{
    const data = await remoteLoad();
    if(!busy && !queue.length){ db = normalize(data); loaded = true; lastError=''; }
    setSync('✓');
  }catch(e){
    lastError = e.server ? e.message : 'Geen verbinding met de Google Sheet';
    setSync(e.server ? e.message : 'offline', true);
  }
  if(!document.querySelector('dialog[open]')) render();
}
function commit(ops){
  ops = ops.filter(o=>o.type!=='delete' || o.ids.length);
  if(!ops.length) return;
  applyOps(db, ops);
  render();
  if(cfg.mode==='local'){ saveJSON(LS_DB, db); return; }
  queue.push(...ops);
  flush();
}
async function flush(){
  if(busy || !queue.length) return;
  busy = true; setSync('Opslaan…');
  const ops = queue.splice(0);
  try{
    const data = await remoteOps(ops);
    if(!queue.length){ db = normalize(data); if(!document.querySelector('dialog[open]')) render(); }
    setSync('✓ opgeslagen');
    busy = false;
  }catch(e){
    busy = false;
    if(e.server){ setSync(e.message, true); toast('Niet opgeslagen: '+e.message); refresh(); return; }
    queue.unshift(...ops);
    setSync('offline…', true);
    setTimeout(flush, 8000);
    return;
  }
  if(queue.length) flush();
}
setInterval(()=>{ if(cfg.mode==='remote' && document.visibilityState==='visible' && !document.querySelector('dialog[open]')) refresh(); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && cfg.mode==='remote') refresh(); });

/* ================= Index & afgeleide gegevens ================= */
function index(){
  const map = arr => Object.fromEntries(arr.map(x=>[x.id,x]));
  const av = {}; db.beschikbaarheid.forEach(b=>av[b.trainingId+'|'+b.kindId]=b.status);
  const abs = new Set(db.afwezig.map(a=>a.trainingId+'|'+a.kindId));
  const rides = {}; db.ritten.forEach(r=>{ (rides[r.trainingId+'|'+r.richting] ||= []).push(r); });
  const trainings = [...db.trainingen].sort((a,b)=>(a.datum+a.start).localeCompare(b.datum+b.start));
  const kids = [...db.kinderen].sort((a,b)=>a.naam.localeCompare(b.naam));
  IX = { k:map(db.kinderen), t:map(db.trainingen), l:map(db.locaties), av, abs, rides, trainings, kids, today: todayStr() };
}
const seats = k => Math.max(0, Math.round(num(k && k.plekken, 0)));
const avail = (tid,kid) => IX.av[tid+'|'+kid] || '';
const canDo = (st,dir) => st==='beide' || st===dir;
const isPast = t => t.datum < IX.today;
const isAbsent = (tid,kid) => IX.abs.has(tid+'|'+kid);
const attending = t => IX.kids.filter(k=>!isAbsent(t.id,k.id));
const ridesFor = (tid,dir) => (IX.rides[tid+'|'+dir]||[]).filter(r=>IX.k[r.kindId]);
const locOf = t => IX.l[t.locatieId] || null;
const weightOf = t => num(locOf(t) && locOf(t).gewicht, 1) || 1;
const rideId = (tid,dir,kid) => `${tid}_${dir}_${kid}`;
const parentOf = k => 'ouder van ' + k.naam;

/* ---- Uitzonderingen ---- */
const ruleDayMatch = (r,t) => r.dag==='alle' || r.dag==='' || r.dag===t.datum || (r.dag.length===1 && new Date(t.datum+'T12:00:00').getDay()===+r.dag);
const ruleDirMatch = (r,dir) => r.richting==='beide' || r.richting===dir;
const ruleParents = r => String(r.ouders||'').split(',').map(s=>s.trim()).filter(Boolean);
function rulesFor(t, dir, kidId){ return db.regels.filter(r=>r.kindId===kidId && IX.k[r.kindId] && ruleDayMatch(r,t) && ruleDirMatch(r,dir)); }
// Set met toegestane chauffeurs (kindIds van hun kind), of null als er geen beperking is
function allowedFor(t, dir, kidId){
  const rs = rulesFor(t, dir, kidId).filter(r=>ruleParents(r).length);
  if(!rs.length) return null;
  let s = new Set(ruleParents(rs[0]));
  for(const r of rs.slice(1)){ const p=new Set(ruleParents(r)); s = new Set([...s].filter(x=>p.has(x))); }
  s.add(kidId); // de eigen ouder mag altijd
  return s;
}
function ruleText(r){
  const when = r.dag==='alle'||!r.dag ? 'elke training' : r.dag.length===1 ? 'op '+DAYS[+r.dag] : fmtDate(r.dag,{weekday:'short',day:'numeric',month:'short'});
  const dir = {heen:'brengen', terug:'halen', beide:'brengen en halen'}[r.richting] || 'brengen en halen';
  const ps = ruleParents(r).map(id=>IX.k[id]?IX.k[id].naam:'?');
  return `${when}, ${dir}: alleen ${ps.length===1?'ouder':'ouders'} van ${andList(ps)}${r.opmerking?' · '+r.opmerking:''}`;
}
const vervoer = (k,dir) => (k[dir]==='fiets' ? 'fiets' : 'auto');
function departure(t){
  const l = locOf(t); if(!t.start) return '';
  const d = new Date(`${t.datum}T${t.start}:00`); d.setMinutes(d.getMinutes() - num(l&&l.reistijd,20) - VERTREK_MARGE);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function carHtml(t, dir, x){
  const others = x.kids.filter(k=>k.id!==x.k.id);
  const tag = k => esc(k.naam) + (rulesFor(t,dir,k.id).length?' 📌':'');
  const bike = others.filter(k=>vervoer(k,dir)==='fiets'), home = others.filter(k=>vervoer(k,dir)!=='fiets');
  const where = x.k.adres ? esc(x.k.adres) : 'huis '+esc(x.k.naam);
  const subs = [];
  if(bike.length) subs.push(`🚲 ${dir==='heen'?'fietsen naar':'fietsen vanaf'} ${where}: ${bike.map(tag).join(', ')}`);
  if(home.length) subs.push(`🏠 ${dir==='heen'?'thuis ophalen':'thuisbrengen'}: ${home.map(tag).join(', ')}`);
  for(const k of x.kids) for(const r of rulesFor(t,dir,k.id)) if(r.opmerking) subs.push(`📌 ${esc(k.naam)}: ${esc(r.opmerking)}`);
  return `<div class="car ${x.k.id===me?'me':''}">🚗 <b>${esc(x.k.naam)}</b>${x.r.vast==='1'?' 🔒':''} <span class="kids">(${x.kids.length}/${x.cap})</span>${subs.map(s=>`<div class="sub">${s}</div>`).join('')}</div>`;
}

function carsFor(t, dir){
  const kids = attending(t);
  const cars = ridesFor(t.id,dir).map(r=>({r, k:IX.k[r.kindId], cap:seats(IX.k[r.kindId]), kids:[]}));
  const placed = new Set(), noSeat = [], ruleIssues = [];
  const put = (k,c) => { c.kids.push(k); placed.add(k.id); };
  // 1. eigen kind in eigen auto
  for(const k of kids){ const c=cars.find(c=>c.k.id===k.id && c.kids.length<c.cap); if(c) put(k,c); }
  // 2. kinderen met een uitzondering in een toegestane auto (minste keuze eerst)
  const constrained = kids.filter(k=>!placed.has(k.id)).map(k=>({k, allow:allowedFor(t,dir,k.id)})).filter(x=>x.allow).sort((a,b)=>a.allow.size-b.allow.size);
  for(const {k,allow} of constrained){
    const c = cars.filter(c=>allow.has(c.k.id) && c.kids.length<c.cap).sort((a,b)=>a.kids.length-b.kids.length)[0];
    if(c) put(k,c); else ruleIssues.push({k, allow});
  }
  // 3. de rest
  for(const k of kids){
    if(placed.has(k.id) || ruleIssues.some(x=>x.k.id===k.id)) continue;
    const c = cars.find(c=>c.kids.length<c.cap); c ? put(k,c) : noSeat.push(k);
  }
  return {cars, noSeat, ruleIssues, need:kids.length, cap:cars.reduce((s,c)=>s+c.cap,0)};
}

function stats(){
  const s = {};
  for(const k of db.kinderen) s[k.id] = {past:0, future:0, weighted:0};
  for(const r of db.ritten){
    const t=IX.t[r.trainingId], st=s[r.kindId]; if(!t || !st) continue;
    isPast(t) ? st.past++ : st.future++;
    st.weighted += weightOf(t);
  }
  return s;
}

/* ================= Planner =================
 * Per training (op datum) en per richting worden ouders gekozen tot er genoeg plekken zijn.
 * Keuze: laagste score = gewogen ritten tot nu toe
 *        + 0,5 als het eigen kind die keer niet meegaat, + 0,25 als die ouder de andere kant al rijdt.
 * Daarna worden overbodige auto's weer geschrapt. Verre locaties tellen zwaarder via 'gewicht'.
 * Verleden en vastgezette ritten blijven altijd staan.
 * mode 'aanvullen': bestaande ritten blijven staan (tenzij de ouder niet meer kan), alleen tekorten worden gevuld.
 * mode 'opnieuw'  : alle niet-vastgezette toekomstige ritten worden opnieuw verdeeld.
 */
function plan(mode){
  index();
  const planned = IX.trainings.filter(t=>!isPast(t));
  const planSet = new Set(planned.map(t=>t.id));
  const keep = [], remove = [];
  for(const r of db.ritten){
    const t=IX.t[r.trainingId], k=IX.k[r.kindId];
    if(!t || !k){ remove.push(r.id); continue; }
    if(!planSet.has(t.id) || r.vast==='1'){ keep.push(r); continue; }
    if(mode==='aanvullen' && canDo(avail(t.id,k.id), r.richting)){ keep.push(r); continue; }
    remove.push(r.id);
  }
  const load = {}; db.kinderen.forEach(k=>load[k.id]=0);
  for(const r of keep){ const t=IX.t[r.trainingId]; if(load[r.kindId]!=null) load[r.kindId]+=weightOf(t); }
  const all = [...keep], added = [], shortages = [];
  for(const t of planned){
    const kids = attending(t);
    if(!kids.length) continue;
    const w = weightOf(t);
    for(const dir of DIRS){
      const cur = all.filter(r=>r.trainingId===t.id && r.richting===dir);
      const used = new Set(cur.map(r=>r.kindId));
      let cap = cur.reduce((s,r)=>s+seats(IX.k[r.kindId]),0);
      const here = [];
      const cands = db.kinderen.filter(k=>!used.has(k.id) && seats(k)>0 && canDo(avail(t.id,k.id),dir));
      const other = new Set(all.filter(r=>r.trainingId===t.id && r.richting!==dir).map(r=>r.kindId));
      const score = k => load[k.id] + (isAbsent(t.id,k.id)?0.5:0) + (other.has(k.id)?0.25:0) + hash01(t.id+dir+k.id)*0.01;
      const take = k => {
        cands.splice(cands.indexOf(k),1); used.add(k.id);
        const r = {id:rideId(t.id,dir,k.id), trainingId:t.id, richting:dir, kindId:k.id, vast:''};
        all.push(r); added.push(r); here.push(r); load[k.id]+=w; cap+=seats(k);
      };
      // 1. eerst uitzonderingen: er moet een toegestane ouder rijden
      const constrained = kids.map(k=>({k, allow:allowedFor(t,dir,k.id)})).filter(x=>x.allow).sort((a,b)=>a.allow.size-b.allow.size);
      const ruleOk = drivers => constrained.every(x=>[...x.allow].some(id=>drivers.has(id)));
      for(const x of constrained){
        if([...x.allow].some(id=>used.has(id))) continue;
        const opts = cands.filter(k=>x.allow.has(k.id)).sort((a,b)=>score(a)-score(b));
        if(opts.length) take(opts[0]); else shortages.push({t, dir, rule:x.k});
      }
      // 2. daarna genoeg plekken
      while(cap < kids.length && cands.length){
        take([...cands].sort((a,b)=>score(a)-score(b))[0]);
      }
      // 3. overbodige auto's weer schrappen (zwaarst belaste ouders eerst), zonder uitzonderingen te breken
      here.sort((a,b)=>load[b.kindId]-load[a.kindId]);
      for(const r of here){
        const s = seats(IX.k[r.kindId]);
        if(cap - s < kids.length) continue;
        const rest = new Set([...used].filter(id=>id!==r.kindId));
        if(!ruleOk(rest) && ruleOk(used)) continue;
        all.splice(all.indexOf(r),1); added.splice(added.indexOf(r),1); used.delete(r.kindId); load[r.kindId]-=w; cap-=s;
      }
      if(cap < kids.length) shortages.push({t, dir, missing:kids.length-cap});
    }
  }
  const keptIds = new Set(keep.map(r=>r.id));
  const reallyAdded = added.filter(r=>!keptIds.has(r.id));
  const ops = [];
  if(remove.length) ops.push(del('ritten', remove));
  if(reallyAdded.length) ops.push(up('ritten', ...reallyAdded));
  return {ops, added:reallyAdded.length, removed:remove.length, shortages};
}

function vSchema(){

    let mineHere = false;
    const dirs = DIRS.map(dir=>{
      const c = carsFor(t, dir);

      const short = kids.length && c.cap < kids.length;
      if((short || c.ruleIssues.length) && !past) shortage++;
      const conflicts = c.cars.filter(x=>!canDo(avail(t.id,x.k.id),dir));

/* ================= Dialogen ================= */
function openDialog(html, onSubmit){
  // Geen echte form-submit: werkt zo ook in afgeschermde voorbeeldvensters
  const d = document.createElement('dialog');
  d.innerHTML = `<form>${html}</form>`;
  document.body.appendChild(d);
  const form = d.querySelector('form');
  d.addEventListener('close', ()=>d.remove());
  form.addEventListener('submit', e=>e.preventDefault());
  d.addEventListener('click', e=>{ if(e.target===d) d.close(); }); // tik naast het venster = sluiten
  let running = false;
  const run = async v => {
    if(running) return;
    if(v==='cancel'){ d.close(); return; }
    if(v==='save' && !form.reportValidity()) return;
    running = true;
    try{ if(await onSubmit(new FormData(form), v, d) !== false) d.close(); }
    finally{ running = false; }
  };
  form.addEventListener('click', e=>{ const b=e.target.closest('button[data-v]'); if(b) run(b.dataset.v); });
  form.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT' && e.target.type!=='checkbox'){ e.preventDefault(); if(form.querySelector('[data-v="save"]')) run('save'); } });
  d.showModal();
  return d;
}
function askConfirm(msg, okLabel='Ja, doorgaan'){

    let answer = false;
    const d = openDialog(`<h3>Weet je het zeker?</h3><p style="margin:0">${esc(msg)}</p>
      <div class="actions"><button type="button" class="btn" data-v="cancel">Annuleren</button><button type="button" class="btn primary" data-v="ok">${esc(okLabel)}</button></div>`,
      () => { answer = true; });
    d.addEventListener('close', ()=>res(answer));
  });
}

function cascadeTraining(ids){

    del('beschikbaarheid', db.beschikbaarheid.filter(b=>s.has(b.trainingId)).map(b=>b.id)),
    del('afwezig', db.afwezig.filter(a=>s.has(a.trainingId)).map(a=>a.id)),
    del('ritten', db.ritten.filter(r=>s.has(r.trainingId)).map(r=>r.id)),

}

function dlgRide(tid, dir){
  const t = IX.t[tid], kids = attending(t);
  const cur = new Map(ridesFor(tid,dir).map(r=>[r.kindId,r]));
  const anyLocked = [...cur.values()].some(r=>r.vast==='1');
  const order = [...IX.kids].sort((a,b)=>(canDo(avail(tid,b.id),dir)-canDo(avail(tid,a.id),dir)) || a.naam.localeCompare(b.naam));
  openDialog(`
    <h3>${dir==='heen'?'Brengen':'Halen'} · ${esc(fmtDate(t.datum))}</h3>
    <p class="small muted" style="margin:0">${kids.length} kinderen gaan mee. Kies welke ouders rijden. Zelf gekozen chauffeurs worden vastgezet 🔒 en daarna niet meer door de planner verschoven.</p>
    <div style="display:flex;flex-direction:column;gap:6px">
    ${order.map(k=>{ const st=avail(tid,k.id); const ok=canDo(st,dir); return `<label class="pick"><input type="checkbox" name="k" value="${esc(k.id)}" ${cur.has(k.id)?'checked':''}>
      <span class="grow">Ouder van ${esc(k.naam)} <small>${seats(k)} plekken · ${st?(ok?'✓ kan':'✗ '+STATUS_LABEL[st].toLowerCase()):'nog niet ingevuld'}</small></span></label>`; }).join('')}
    </div>
    <div class="actions">${anyLocked?`<button type="button" class="btn left" data-v="unlock">🔓 Ontgrendel</button>`:''}${cancelBtn}${saveBtn()}</div>`,
  (fd, v)=>{
    if(v==='unlock'){ commit([up('ritten', ...[...cur.values()].map(r=>({id:r.id, vast:''})))]); return; }
    const sel = new Set(fd.getAll('k'));
    const ops = [];
    const rm = [...cur.values()].filter(r=>!sel.has(r.kindId)).map(r=>r.id);
    if(rm.length) ops.push(del('ritten', rm));
    const rows = [...sel].map(kid=> cur.has(kid) ? {id:cur.get(kid).id, vast:'1'} : {id:rideId(tid,dir,kid), trainingId:tid, richting:dir, kindId:kid, vast:'1'});
    if(rows.length) ops.push(up('ritten', ...rows));
    commit(ops);
  });
}

function whatsappText(){
  const ts = IX.trainings.filter(t=>!isPast(t) && attending(t).length);
  const lines = ['🏑 *Rijschema zaalhockey*', ''];
  for(const t of ts){
    const l = locOf(t);
    lines.push(`*${fmtDate(t.datum)}* · ${t.start}${t.eind?'–'+t.eind:''} · ${l?l.naam:''}`);
    for(const dir of DIRS){
      const c = carsFor(t,dir);
      lines.push(`${dir==='heen'?'➡️ *Brengen*'+(t.start&&c.cars.length?' (vertrek ± '+departure(t)+')':''):'⬅️ *Halen*'}${c.cars.length?'':': —'}`);
      for(const x of c.cars){
        const others = x.kids.filter(k=>k.id!==x.k.id).map(k=>k.naam + (vervoer(k,dir)==='fiets'?' 🚲':'') + (rulesFor(t,dir,k.id).length?' 📌':''));
        lines.push(`  • ouder van ${x.k.naam}${others.length?': '+others.join(', '):''}`);
        for(const k of x.kids) for(const r of rulesFor(t,dir,k.id)) if(r.opmerking) lines.push(`    📌 ${k.naam}: ${r.opmerking}`);
      }
      if(c.cap<c.need) lines.push(`  ⚠️ nog ${c.need-c.cap} plek(ken) nodig`);
      for(const x of c.ruleIssues) lines.push(`  ⚠️ ${x.k.naam} mag alleen mee met een vaste ouder`);
    }
    const absent = IX.kids.filter(k=>isAbsent(t.id,k.id));
    if(absent.length) lines.push(`_Afwezig: ${absent.map(k=>k.naam).join(', ')}_`);
    lines.push('');
  }
  lines.push('🚲 = fietst naar/van het adres van de chauffeur · 📌 = uitzondering');
  return lines.join('\n').trim();
}
function icsDesc(t, dir, car){
  const out = ['Training '+t.start+(t.eind?'–'+t.eind:'')];
  for(const k of car.kids){
    if(k.id===car.k.id){ out.push(k.naam+' (eigen kind)'); continue; }
    const f = vervoer(k,dir)==='fiets';
    out.push(k.naam + ': ' + (f ? (dir==='heen'?'fietst naar jou':'fietst vanaf jou naar huis') : (dir==='heen'?'ophalen':'thuisbrengen') + (k.adres?' – '+k.adres:'')) + (k.telefoon?' – '+k.telefoon:''));
    for(const r of rulesFor(t,dir,k.id)) if(r.opmerking) out.push('  📌 '+r.opmerking);
  }
  return out.join('\n');
}
function icsMine(){
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const ie = s => String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const out = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rijschema zaalhockey//NL','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  let n = 0;
  for(const t of IX.trainings.filter(t=>!isPast(t))){
    const l = locOf(t), travel = num(l && l.reistijd, 20);
    const start = new Date(`${t.datum}T${t.start||'00:00'}:00`);
    const end = t.eind ? new Date(`${t.datum}T${t.eind}:00`) : new Date(start.getTime()+60*60000);
    for(const dir of DIRS){
      const car = carsFor(t,dir).cars.find(x=>x.k.id===me);
      if(!car) continue;
      const s = dir==='heen' ? new Date(start.getTime()-(travel+VERTREK_MARGE)*60000) : end;
      const e = dir==='heen' ? start : new Date(end.getTime()+travel*60000);
      out.push('BEGIN:VEVENT', `UID:${car.r.id}@rijschema`, `DTSTAMP:${stamp}`, `DTSTART:${fmt(s)}`, `DTEND:${fmt(e)}`,
        `SUMMARY:${ie((dir==='heen'?'🚗 Brengen':'🚗 Halen')+' zaalhockey')}`,
        `LOCATION:${ie(l?(l.adres||l.naam):'')}`,
        `DESCRIPTION:${ie(icsDesc(t,dir,car))}`, 'END:VEVENT');
      n++;
    }
  }
  out.push('END:VCALENDAR');
  if(!n){ toast('Je hebt nog geen komende ritten'); return; }
  download('mijn-ritten-zaalhockey.ics', out.join('\r\n'), 'text/calendar');
  toast(`${n} ritten in agendabestand gezet`);
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}
// Op iPhone: deelmenu (direct naar WhatsApp). Anders: kopiëren.
async function shareOrCopy(text, copiedMsg){
  if(navigator.share){
    try{ await navigator.share({text}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  toast(await copyText(text) ? copiedMsg : 'Kopiëren lukte niet');
}
let toastTimer;
function toast(msg){
  let t = $('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 3500);
}

  kidEdit: ds => dlgKid(ds.id),
  trNew: () => dlgTraining(null),
  trEdit: ds => dlgTraining(ds.id),
  trSeries: () => dlgSeries(),
  locNew: () => dlgLocation(null),
  locEdit: ds => dlgLocation(ds.id),
  copy: async ds => { toast(await copyText(ds.text) ? 'Gekopieerd' : 'Kopiëren lukte niet'); },
  connect: () => connect(),
  demo: async () => {
    if(cfg.mode==='local' && db.kinderen.length && !await askConfirm('Huidige gegevens op dit apparaat vervangen door demo-gegevens?')) return;
    cfg.mode='local'; saveJSON(LS_CFG,cfg); db=demoData(); saveJSON(LS_DB,db); me='k0'; lsSet(LS_ME,me); loaded=true; tab='schema'; lsSet(LS_TAB,tab); render();
    toast('Demo geladen. Tik op ⚡ Planning aanvullen.');
  },
  export: () => download(`rijschema-backup-${todayStr()}.json`, JSON.stringify(db,null,1), 'application/json'),
  import: () => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = async () => {
      try{
        const data = normalize(JSON.parse(await inp.files[0].text()));
        if(!await askConfirm('Alle huidige gegevens vervangen door deze back-up?')) return;
        const ops = Object.keys(TABLES).flatMap(k=>[del(k, db[k].map(r=>r.id)), ...(data[k].length?[up(k, ...data[k])]:[])]);
        commit(ops); toast('Back-up teruggezet');
      }catch(e){ toast('Kon bestand niet lezen'); }
    };
    inp.click();
  },
  disconnect: async () => {
    if(!await askConfirm('Verbinding verbreken op dit apparaat?')) return;
    cfg={api:DEFAULT_API_URL, code:'', mode:''}; saveJSON(LS_CFG,cfg); loaded=false; db=emptyDb(); render();
  },
};
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.tagName==='A') e.preventDefault();
  const fn = ACT[b.dataset.act]; if(fn) fn(b.dataset, b, e);
});
document.addEventListener('change', e=>{
  const c = e.target.dataset.chg; if(!c) return;
  if(c==='me'){ me = e.target.value; lsSet(LS_ME, me); }
  if(c==='mine') view.mine = e.target.checked;
  if(c==='past') view.past = e.target.checked;
  render();
});
document.addEventListener('submit', e=>{ if(e.target.id==='connectForm'){ e.preventDefault(); connect(); } });
async function connect(){
  const form = $('#connectForm'); if(!form.reportValidity()) return;
  const fd = new FormData(form);
  const prev = {...cfg}, localDb = cfg.mode==='local' ? db : null;
  cfg = {api:String(fd.get('api')).trim(), code:String(fd.get('code')).trim(), mode:'remote'};
  setSync('Verbinden…');
  try{
    const data = await remoteLoad();
    saveJSON(LS_CFG, cfg); loaded = true; lastError='';
    db = normalize(data);
    if(fd.get('upload') && localDb){
      commit(Object.keys(TABLES).filter(k=>localDb[k].length).map(k=>up(k, ...localDb[k])));
    }
    setSync('✓ verbonden'); toast('Verbonden met de Google Sheet');
    tab = db.kinderen.length ? 'beschikbaar' : 'kinderen'; lsSet(LS_TAB, tab);
    render();
  }catch(err){
    cfg = prev;
    setSync(err.server ? err.message : 'Verbinden mislukt', true);
    toast(err.server ? err.message : 'Verbinden mislukt. Klopt de URL en staat toegang op "Iedereen"?');
  }
}

refresh();
</script>
</body>
</html>
